<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Crect x='8' y='14' width='48' height='36' rx='6' fill='none' stroke='%2335e7ef' stroke-width='4'/%3E%3Cpath d='M11 18 L32 36 L53 18' fill='none' stroke='%2335e7ef' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"><title>Формуляр за Контакт</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <form id="contact-form" novalidate>
    <!-- honeypot: невидимо за хора, ботовете го попълват -->
    <input type="text" id="website" name="website" class="hp" tabindex="-1" autocomplete="off">

    <label><i class="fas fa-user"></i> Име <span class="required">*</span></label>
    <input type="text" id="name" maxlength="100" required>

    <label><i class="fas fa-phone"></i> Телефонен номер (по желание)</label>
    <input type="tel" id="phone" maxlength="50">

    <label><i class="fas fa-at"></i> Електронна поща за отговор <span class="required">*</span></label>
    <input type="email" id="email" maxlength="200" required>

    <label><i class="fas fa-comment-dots"></i> Съобщение <span class="required">*</span></label>
    <textarea id="message" maxlength="3000" required></textarea>

    <p class="status" id="status" role="status"></p>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="cancel-btn"><i class="fas fa-times"></i> Отказ</button>
      <button type="submit" class="btn btn-primary" id="submit-btn"><i class="fas fa-paper-plane"></i> Изпрати</button>
    </div>
  </form>

  <div class="contact-ok" id="success" hidden>
    <div class="big">✅</div>
    <h3>Съобщението е изпратено!</h3>
    <p>Ще отговорим на посочената електронна поща възможно най-скоро.</p>
    <div class="modal-actions" style="justify-content:center;">
      <button type="button" class="btn btn-outline" id="close-btn"><i class="fas fa-check"></i> Затвори</button>
    </div>
  </div>
</div>

<script src="form.js"></script>
</body>
</html>
